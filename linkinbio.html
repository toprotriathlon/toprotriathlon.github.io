<script>
  // 輪播：scroll-snap 負責滑動，這裡只處理圓點與自動播放
  (function () {
    var root = document.querySelector('.lib-carousel');
    if (!root) return;
    var track = root.querySelector('.lib-carousel-track');
    var slides = root.querySelectorAll('.lib-slide');
    var dotsWrap = root.querySelector('.lib-carousel-dots');
    var timer = null;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    slides.forEach(function (_, i) {
      var d = document.createElement('button');
      d.type = 'button';
      d.setAttribute('aria-label', '第 ' + (i + 1) + ' 張');
      d.addEventListener('click', function () { go(i); restart(); });
      dotsWrap.appendChild(d);
    });
    dotsWrap.hidden = slides.length < 2;
    var dots = dotsWrap.querySelectorAll('button');

    function index() { return Math.round(track.scrollLeft / track.clientWidth); }
    function go(i) {
      i = (i + slides.length) % slides.length;
      track.scrollTo({ left: i * track.clientWidth, behavior: reduce ? 'auto' : 'smooth' });
    }
    function mark() {
      var cur = index();
      dots.forEach(function (d, i) { d.classList.toggle('is-active', i === cur); });
    }
    function restart() {
      clearInterval(timer);
      if (reduce || slides.length < 2) return;
      timer = setInterval(function () { go(index() + 1); }, 4000);
    }

    track.addEventListener('scroll', mark, { passive: true });
    root.addEventListener('pointerdown', function () { clearInterval(timer); });
    root.addEventListener('pointerup', restart);
    root.addEventListener('mouseenter', function () { clearInterval(timer); });
    root.addEventListener('mouseleave', restart);
    window.addEventListener('resize', function () { go(index()); });
    mark(); restart();
  })();
</script>

<script>
  function refreshPanelHeight(panel) {
    if (!panel) return;
    var item = panel.closest('.lib-item');
    if (item && item.classList.contains('is-open')) {
      // 先設回 auto 量出真實高度，再指定回去讓 transition 能正確動畫
      panel.style.maxHeight = 'none';
      var h = panel.scrollHeight;
      panel.style.maxHeight = h + 'px';
    }
  }

  // ============ 團練行事曆 / 當月活動 ============
  // 團練行事曆已換成正式場次；當月活動目前仍為範例資料，確定後請直接替換
  var teamScheduleData = [
    { date: '2026-07-07', time: '19:00', title: '間歇跑 700m × 6–8 組', desc: '桃園三民運動公園' },
    { date: '2026-07-11', time: '05:30', title: '長距離跑 12–15K', desc: '蘆興景觀埤塘生態公園' },
    { date: '2026-07-12', time: '06:00', title: '北海岸看海路線・約騎 80K', desc: '詳細集合地點另行公布' },
    { date: '2026-07-31', time: '20:15', title: '游泳團練', desc: '桃園市立游泳池' }
  ];
  var monthlyEventData = [
    { date: '2026-07-05', time: '07:15', title: 'TO PRO × Loop Café 編織 × 咖啡跑', desc: 'Loop Cafe 路譜咖啡' },
    { date: '2026-07-25', time: '07:45', title: 'Bætter × TO PRO 桃園女子跑聚', desc: '肉球尼尼 Meatball Nini' }
  ];

  var weekdayNames = ['日', '一', '二', '三', '四', '五', '六'];

  function renderCardScheduleList(listEl, items, groupKey) {
    listEl.innerHTML = '';
    items.forEach(function (item) {
      var d = new Date(item.date + 'T00:00:00');
      var day = String(d.getDate()).padStart(2, '0');
      var weekday = weekdayNames[d.getDay()];
      var li = document.createElement('li');
      var detailHref = 'event.html' +
        '?title=' + encodeURIComponent(item.title) +
        '&date=' + encodeURIComponent(item.date) +
        '&time=' + encodeURIComponent(item.time) +
        '&location=' + encodeURIComponent(item.desc) +
        '&group=' + groupKey;
      // 整列都是可點擊的連結，而非只有右下角的小箭頭，避免觸控熱區過小
      li.innerHTML =
        '<a class="sched-card-item" href="' + detailHref + '" target="_blank" rel="noopener" aria-label="查看「' + item.title + '」詳情頁">' +
          '<span class="sched-card-date-block">' +
            '<span class="sched-card-day">' + day + '</span>' +
            '<span class="sched-card-weekday">週' + weekday + '</span>' +
          '</span>' +
          '<span class="sched-card-main">' +
            '<span class="sched-card-left">' +
              '<span class="sched-card-title">' + item.title + '</span>' +
              '<span class="sched-card-location">' + item.desc + '</span>' +
            '</span>' +
            '<span class="sched-card-right">' +
              '<span class="sched-card-time">' + item.time + '</span>' +
              '<span class="sched-card-arrow" aria-hidden="true">↗</span>' +
            '</span>' +
          '</span>' +
        '</a>';
      listEl.appendChild(li);
    });
  }

  renderCardScheduleList(document.getElementById('teamScheduleList'), teamScheduleData, 'team');
  renderCardScheduleList(document.getElementById('monthlyEventList'), monthlyEventData, 'monthly');

  document.querySelectorAll('[data-toggle]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var item = btn.closest('.lib-item');
      var panel = item.querySelector('.lib-panel');
      var wasOpen = item.classList.contains('is-open');

      // 收合所有其他已展開的項目（一次只開一個，畫面更清爽）
      document.querySelectorAll('.lib-item.is-open').forEach(function (openItem) {
        if (openItem !== item) {
          openItem.classList.remove('is-open');
          openItem.querySelector('.lib-panel').style.maxHeight = '0px';
        }
      });

      item.classList.toggle('is-open', !wasOpen);

      // 第一次展開時才載入 iframe（延遲載入，加快頁面初始速度）
      if (!wasOpen) {
        var iframe = panel.querySelector('iframe[data-src]');
        if (iframe) {
          iframe.src = iframe.getAttribute('data-src');
          iframe.removeAttribute('data-src');
        }
        // 展開：動態量出真實內容高度，避免被固定高度裁切
        panel.style.maxHeight = panel.scrollHeight + 'px';
        setTimeout(function () {
          item.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 150);
      } else {
        panel.style.maxHeight = '0px';
      }
    });
  });

  // 內容尺寸改變時（例如圖片載入完成、視窗縮放）重新量測已展開面板的高度
  window.addEventListener('resize', function () {
    document.querySelectorAll('.lib-item.is-open .lib-panel').forEach(refreshPanelHeight);
  });
  document.querySelectorAll('.lib-item .lib-panel img').forEach(function (img) {
    img.addEventListener('load', function () { refreshPanelHeight(img.closest('.lib-panel')); });
  });

</script>
